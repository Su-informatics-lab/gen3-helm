---
# Apply this manifest separately from the Anagine Helm release after creating
# ardac2prd-default-anagine-creds in AWS Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anagine-secret
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gen3-secret-store
    kind: SecretStore
  target:
    name: anagine-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ardac2prd-default-anagine-creds
        property: OPENAI_API_KEY
